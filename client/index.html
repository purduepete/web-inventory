<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <!-- iOS ignores an SVG favicon when adding to the home screen and needs this PNG. -->
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="Web Inventory" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <!-- No apple-mobile-web-app-status-bar-style: iOS then reserves the status bar instead of
             drawing under it, and paints that strip from theme-color, which the script below and
             App.tsx keep on the active theme. -->
        <meta name="theme-color" content="#020617" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap"
            rel="stylesheet"
        />
        <title>Web Inventory</title>
        <!-- The CSP in public/staticwebapp.config.json allows this block by sha256 hash.
             Edit it and the hash must be recomputed, or it is blocked and the theme flashes. -->
        <script>
            // Apply saved theme before paint to avoid a flash of the wrong theme.
            (function () {
                var choice = 'midnight';
                try { choice = localStorage.getItem('theme') || 'midnight'; } catch (e) {}
                var t = choice === 'light' || (choice === 'system' && !window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'light' : 'dark';
                var root = document.documentElement;
                root.setAttribute('data-theme', t);
                root.classList.toggle('light', t === 'light');
                root.classList.toggle('dark', t === 'dark');
                root.classList.toggle('theme-midnight', t === 'dark');
                root.style.colorScheme = t;
                var bg = t === 'light' ? '#ffffff' : '#020617';
                root.style.backgroundColor = bg;
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', bg);
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
