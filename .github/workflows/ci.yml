name: CI

# Regression gate: runs on every PR to main (never deploys). Deploys still live in
# azure-static-web-apps.yml / deploy-api.yml on push to main.
on:
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    client:
        runs-on: ubuntu-latest
        name: Client (lint + type-check + build)
        defaults:
            run:
                working-directory: client
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: client/package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm run build # runs `tsc` (type-check) then `vite build`

    api:
        runs-on: ubuntu-latest
        name: API (build)
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '8.0.x'
            - run: dotnet build api -c Release
